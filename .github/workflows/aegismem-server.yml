name: aegismem-server

on:
  push:
    branches: [main]
    paths: ["AegisMem/server/**", ".github/workflows/aegismem-server.yml"]
  pull_request:
    paths: ["AegisMem/server/**", ".github/workflows/aegismem-server.yml"]
  workflow_call:   # reused by release.yml as the release gate

concurrency:
  group: aegismem-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AegisMem/server
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis" --health-interval 5s
          --health-timeout 5s --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.17.0
        ports: ["6333:6333"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AEGIS_TEST_REDIS_URL: redis://localhost:6379/0
      AEGIS_TEST_QDRANT: localhost:6333
      AEGIS_TEST_PG_URL: postgresql+asyncpg://aegis:aegis@localhost:5432/aegis_test
      AEGIS_MIGRATION_URL: postgresql://aegis:aegis@localhost:5432/aegis_migrations
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: AegisMem/server/pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: AegisMem/server/sdk/typescript/package-lock.json
      - name: Install
        run: |
          pip install -e ".[dev]"
          npm ci --prefix sdk/typescript
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4.3.1
      - name: Helm chart lint
        run: helm lint --strict infra/helm/aegismem
      - name: TypeScript SDK typecheck
        run: npm run typecheck --prefix sdk/typescript
      - name: Migrations round-trip on Postgres
        run: |
          PGPASSWORD=aegis psql -h localhost -U aegis -d aegis_test -c "CREATE DATABASE aegis_migrations"
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Tests (SQLite + Postgres)
        run: pytest -q
      - name: aegis-bench (gated)
        run: python -m bench.run --out bench-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: bench-results-py${{ matrix.python }}
          path: AegisMem/server/bench-results/
