# Tag-triggered release: `git tag v0.1.0 && git push origin v0.1.0`.
# One-time setup (repository owner):
#   * PyPI: add a Trusted Publisher for each project (aegismem, aegismem-client, aegismem-mcp,
#     aegismem-agents, aegis-audit) -> this repo, workflow release.yml, environment "release".
#   * npm:  create an automation token and store it as the NPM_TOKEN secret.
#   * GHCR: nothing; GITHUB_TOKEN publishes images and the Helm chart.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/aegismem-server.yml

  python-packages:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # PyPI trusted publishing (no stored tokens)
    strategy:
      matrix:
        package: [".", "sdk/python", "integrations/mcp", "integrations/frameworks", "audit"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: "3.12" }
      - name: Build
        run: |
          pip install build twine
          python -m build --outdir dist "AegisMem/server/${{ matrix.package }}"
          twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with: { packages-dir: dist }

  npm-package:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - run: npm ci --prefix AegisMem/server/sdk/typescript
      - run: npm publish --provenance --access public
        working-directory: AegisMem/server/sdk/typescript
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/aegismem-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: AegisMem/server
          file: AegisMem/server/infra/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  helm-chart:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4.3.1
      - name: Package and push chart (OCI)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm lint --strict AegisMem/server/infra/helm/aegismem
          helm package AegisMem/server/infra/helm/aegismem --version "$VERSION" --app-version "$VERSION"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "aegismem-$VERSION.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
