# Scrapes the local Aegis stack (./aegis up --observability).
global:
  scrape_interval: 10s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: aegistrace-api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: aegistrace-worker
    static_configs: [{targets: ["worker:9101"]}]
  - job_name: aegistrace-dispatcher
    static_configs: [{targets: ["dispatcher:9102"]}]
  - job_name: aegismem
    metrics_path: /metrics
    static_configs: [{targets: ["aegismem:8000"]}]
