# API: stateless, horizontally scalable. Secrets come from a secret store via
# the CSI driver / External Secrets (referenced, never inlined here).
apiVersion: v1
kind: ServiceAccount
metadata: {name: aegistrace-api, namespace: aegistrace}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: aegistrace-api, namespace: aegistrace, labels: {app: aegistrace-api}}
spec:
  replicas: 3
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: aegistrace-api}}
  template:
    metadata: {labels: {app: aegistrace-api}}
    spec:
      serviceAccountName: aegistrace-api
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: REGISTRY/aegistrace:VERSION  # set by the release pipeline (digest-pinned)
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: aegistrace-config}}]
          env:
            - {name: AEGIS_DATABASE_URL, valueFrom: {secretKeyRef: {name: aegistrace-db, key: app_url}}}
            - {name: AEGIS_SIGNING_KEY_FILE, value: /run/aegis/signing-key.pem}
          volumeMounts:
            - {name: signing-key, mountPath: /run/aegis, readOnly: true}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, failureThreshold: 3}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: signing-key
          secret: {secretName: aegistrace-signing-key, defaultMode: 0400}
---
apiVersion: v1
kind: Service
metadata: {name: aegistrace-api, namespace: aegistrace}
spec:
  selector: {app: aegistrace-api}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: aegistrace-api, namespace: aegistrace}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: aegistrace-api}
  minReplicas: 3
  maxReplicas: 20
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: aegistrace-api, namespace: aegistrace}
spec:
  minAvailable: 2
  selector: {matchLabels: {app: aegistrace-api}}
