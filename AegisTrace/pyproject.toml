[project]
name = "aegistrace"
version = "0.1.0.dev0"
description = "Verifiable agent execution infrastructure"
requires-python = ">=3.12"
license = "FSL-1.1-ALv2 AND Apache-2.0"
license-files = ["LICENSE", "LICENSES/*"]
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=46.0.0",
    "fastapi>=0.162.0",
    "prometheus-client>=0.21",
    "psycopg>=3.3.6",  # images use Debian libpq5; the [binary] wheel is dev-only (vendors libs, see SECURITY_RISKS)
    "pydantic>=2",
    "pyjwt[crypto]>=2.15.1",
    "redis>=5",
    "sqlalchemy>=2.0",
    "uvicorn>=0.54.0",
    "aegistrace-sdk",
    "mcp>=1.20",
    "jsonschema>=4.23",
    "pyyaml>=6.0.2",
]

[project.scripts]
aegistrace-verify = "aegistrace.evidence.cli:main"
aegistrace-worker = "aegistrace.workers.main:worker_main"
aegistrace-dispatcher = "aegistrace.workers.main:dispatcher_main"
aegistrace = "aegistrace.cli.main:main"

[dependency-groups]
dev = [
    "psycopg[binary]>=3.3.6",
    "pytest>=8.4",
    "hypothesis>=6.140",
    "ruff>=0.14",
    "mypy>=1.18",
    "httpx>=0.28.1",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261030",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/core/src/aegistrace"]

[tool.hatch.build.targets.wheel.sources]
"packages/core/src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["packages/core/src", "."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.mypy]
strict = true
files = ["packages/core/src", "packages/sdk-python/src"]

[tool.ruff.lint.isort]
known-first-party = ["aegistrace", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501", "F811"]
"packages/core/src/aegistrace/api/app.py" = ["B008"]  # FastAPI Depends() idiom
"packages/core/src/aegistrace/sandbox/docker_runner.py" = ["S108"]  # /tmp paths are inside the container
"benchmarks/**" = ["S603", "S607", "E501"]
"scripts/**" = ["S603", "S607"]

[tool.uv.sources]
aegistrace-sdk = { path = "packages/sdk-python", editable = true }

[[tool.mypy.overrides]]
# The SDK's HTTP layer returns decoded JSON (Any) by design.
module = "aegistrace_sdk.client"
warn_return_any = false
