[project]
name = "aegis-api"
version = "0.1.0.dev0"
description = "AegisOS HTTP API"
requires-python = ">=3.12"
license = "FSL-1.1-ALv2"
dependencies = [
    "aegistrace",
    "aegisguard",
    "aegisruntime",
    "fastapi>=0.162.0",
    "prometheus-client>=0.21",
    "pydantic>=2",
    "redis>=5",
    "sqlalchemy>=2.0",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
aegistrace = { workspace = true }
aegisguard = { workspace = true }
aegisruntime = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_api"]
