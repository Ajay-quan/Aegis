[project]
name = "aegis-cli"
version = "0.1.0.dev0"
description = "AegisOS command-line interface"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "aegistrace",
    "aegistrace-sdk",
    "httpx>=0.28.1",
]

[project.scripts]
aegistrace = "aegis_cli.main:main"

[tool.uv.sources]
aegistrace = { workspace = true }
aegistrace-sdk = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_cli"]
