# Aegis: AegisTrace + AegisMem, connected, on one machine.
#
#   ./aegis up        # first run bootstraps dev keys and tokens, then starts everything
#
# Local development only: dev signing keys, AegisMem auth off and reachable only
# on the internal network, mock embeddings unless you set EMBEDDING_BACKEND.
name: aegis

include:
  - path: AegisTrace/compose.yaml
    env_file: aegis.env

services:
  aegismem-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aegismem
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev-aegismem-superuser
      AEGIS_OWNER_PASSWORD: dev-aegismem-owner
      AEGIS_APP_PASSWORD: dev-aegismem-app
    volumes:
      - aegismem_pg:/var/lib/postgresql/data
      - ./AegisMem/server/infra/compose/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegismem"]
      interval: 3s
      retries: 30

  aegismem-migrate:
    build: {context: AegisMem/server, dockerfile: infra/docker/Dockerfile}
    environment:
      AEGIS_MIGRATION_URL: postgresql://aegis_owner:dev-aegismem-owner@aegismem-postgres:5432/aegismem
      AEGIS_VECTOR_DIM: "384"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      aegismem-postgres: {condition: service_healthy}
    restart: "no"

  aegismem:
    build: {context: AegisMem/server, dockerfile: infra/docker/Dockerfile}
    environment:
      APP_ENV: development
      CONTROL_DATABASE_URL: postgresql+asyncpg://aegis_app:dev-aegismem-app@aegismem-postgres:5432/aegismem  # receipts, keys, ledger
      AUTH_ENABLED: "false"  # reachable only on the compose network (no published port)
      POSTGRES_HOST: aegismem-postgres
      POSTGRES_DB: aegismem
      POSTGRES_USER: aegis_app
      POSTGRES_PASSWORD: dev-aegismem-app
      MEMORY_BACKEND: postgres
      VECTOR_BACKEND: pgvector
      GRAPH_BACKEND: none
      EMBEDDING_DIMENSION: "384"
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-mock}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-https://api.openai.com/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      DEFAULT_LLM_PROVIDER: ${AEGISMEM_LLM_PROVIDER:-mock}
    depends_on:
      aegismem-migrate: {condition: service_completed_successfully}

  # Development identity provider, so the dashboard's real sign-in (OIDC code +
  # PKCE) works locally. In production, point the dashboard at your company's
  # provider instead (AEGIS_OIDC_DISCOVERY_URL) and drop this service.
  dev-idp:
    build: {context: AegisTrace, dockerfile: infra/docker/Dockerfile}
    command: ["aegistrace-dev-idp"]
    environment:
      AEGIS_DEV_IDP_KEYS: /run/aegis
      AEGIS_DEV_IDP_PUBLIC_URL: http://localhost:9000
      AEGIS_DEV_IDP_REDIRECT_URIS: http://localhost:3000/auth/callback,http://127.0.0.1:3100/auth/callback
    volumes: ["./AegisTrace/.dev/secrets:/run/aegis:ro"]
    ports: ["127.0.0.1:9000:9000"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9000/jwks')"]
      interval: 3s
      retries: 20

  dashboard:
    build: {context: AegisTrace, dockerfile: apps/dashboard/Dockerfile}
    environment:
      AEGIS_API_URL: http://api:8000
      AEGIS_DASHBOARD_HTTP: "1"
      AEGIS_DASHBOARD_URL: http://localhost:3000
      AEGIS_OIDC_DISCOVERY_URL: http://dev-idp:9000/.well-known/openid-configuration
      AEGIS_OIDC_PROVIDER_NAME: the dev identity provider
    ports: ["127.0.0.1:3000:3000"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api: {condition: service_healthy}
      dev-idp: {condition: service_healthy}

volumes:
  aegismem_pg:
