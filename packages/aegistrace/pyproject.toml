[project]
name = "aegistrace"
version = "0.1.0.dev0"
description = "AegisTrace: tamper-evident evidence, receipts, offline verifier, metrics and insights"
requires-python = ">=3.12"
license = "Apache-2.0 AND FSL-1.1-ALv2"
dependencies = [
    "cryptography>=46.0.0",
    "prometheus-client>=0.21",
    "sqlalchemy>=2.0",
]

[project.scripts]
aegistrace-verify = "aegistrace.evidence.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegistrace"]
