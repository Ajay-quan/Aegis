[project]
name = "aegisguard"
version = "0.1.0.dev0"
description = "AegisGuard: policy decisions, organization rules, identity and sandboxing"
requires-python = ">=3.12"
license = "FSL-1.1-ALv2"
dependencies = [
    "aegistrace",
    "cryptography>=46.0.0",
    "httpx>=0.28.1",
    "pydantic>=2",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0",
]

[tool.uv.sources]
aegistrace = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegisguard"]
